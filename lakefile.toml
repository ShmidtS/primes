name = "primes"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Hagi"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Named hypotheses are part of the documented API contract of each R-round
# theorem (h_emp_*, controller obligations) — intentionally kept even when a
# particular proof does not use one directly.
weak.linter.unusedHypotheses = false

# Local prebuilt Mathlib (lean-4.35.0 toolchain, built at C:/Users/shmid/mathlib4).
[[require]]
name = "mathlib"
scope = "leanprover-community"
path = "C:/Users/shmid/mathlib4"

[[lean_lib]]
name = "Primes"

[[lean_lib]]
name = "Hagi"

# Review stage 6: per-directory package for incremental builds.
[[lean_lib]]
name = "Hagi.Architecture"

name = "primes"
version = "0.1.0"
keywords = ["math"]
# Default user build. Hagi.Research (quarantine, provenance only) is
# built explicitly by scripts/ci.sh and by scripts/inventory.lean's
# imports (Freeze); it is not part of `lake build`.
defaultTargets = ["Hagi", "Hagi.Benchmarks"]

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Surface unused hypotheses as warnings. Named hypotheses stay in
# signatures (documented API contract); the linter only highlights
# which ones a given proof does not use directly.
weak.linter.unusedHypotheses = true

# Local prebuilt Mathlib override (developer machine, lean-4.36.0
# toolchain built at C:/Users/shmid/mathlib4). For a FRESH CLONE
# without that path, replace this require block with the canonical
# fetch config, pinned to scripts/mathlib-rev.txt:
#   [[require]]
#   name = "mathlib"
#   scope = "leanprover-community"
#   git = "https://github.com/leanprover-community/mathlib4.git"
#   rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"
# then delete lake-manifest.json's mathlib `dir` entry (or the whole
# manifest) and run `lake build` (fetches ~several GB; MATHLIBPIN gate
# checks the same pin). Toolchain: see lean-toolchain + the pinned
# Lean commit in scripts/mathlib-rev.txt line 2.
[[require]]
name = "mathlib"
scope = "leanprover-community"
path = "C:/Users/shmid/mathlib4"

[[require]]
name = "natural"
git = "https://github.com/medovina/natural_lean.git"
rev = "14305b83fab2ae2681c63605af4af8312084c55c"

# One lean_lib per directory: the root `Hagi` lib builds only the
# import closure of Hagi.lean; the per-directory libs are targets
# for incremental builds.
[[lean_lib]]
name = "Hagi"

[[lean_lib]]
name = "Hagi.Architecture"
globs = ["Hagi.Architecture.+"]
[[lean_lib]]
name = "Hagi.Audit"
globs = ["Hagi.Audit.+"]

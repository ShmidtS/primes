# Quarantine: outside the root closure of Hagi.lean, kept for
# provenance (README "Честные границы"). Hagi.Research is not a default
# target; scripts/ci.sh builds it explicitly.
[[lean_lib]]
name = "Hagi.Benchmarks"
globs = ["Hagi.Benchmarks", "Hagi.Benchmarks.+"]
[[lean_lib]]
name = "Hagi.Research"
globs = ["Hagi.Research", "Hagi.Research.+"]

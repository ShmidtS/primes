name = "primes"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Hagi", "Hagi.Legacy", "Hagi.Benchmarks", "Hagi.Research"]

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Audit v2 request: surface unused hypotheses as warnings. Named hypotheses
# remain in signatures (documented API contract); the linter only highlights
# which ones a given proof does not use directly.
weak.linter.unusedHypotheses = true

# Local prebuilt Mathlib (lean-4.35.0 toolchain, built at C:/Users/shmid/mathlib4).
[[require]]
name = "mathlib"
scope = "leanprover-community"
path = "C:/Users/shmid/mathlib4"

[[require]]
name = "natural"
git = "https://github.com/medovina/natural_lean.git"
rev = "14305b83fab2ae2681c63605af4af8312084c55c"

[[lean_lib]]
name = "Hagi"

# Review stage 6: per-directory package for incremental builds.
[[lean_lib]]
name = "Hagi.Architecture"
globs = ["Hagi.Architecture.+"]


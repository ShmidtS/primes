globs = ["Hagi.Core.+"]
[[lean_lib]]
name = "Hagi.Data"
globs = ["Hagi.Data.+"]
[[lean_lib]]
name = "Hagi.Dynamics"
globs = ["Hagi.Dynamics.+"]
[[lean_lib]]
name = "Hagi.Energy"
globs = ["Hagi.Energy.+"]
[[lean_lib]]
